# assay.toml — declarative configuration for the ASSAY skill suite.
#
# Single source of truth for how the MCP server is launched and where skills
# live. `configure_mcp.py` reads this to generate `mcp_config.json` (the concrete
# env->python->server wiring) with the local conda prefix patched in. Kept
# declarative so the wiring is reproducible and each skill's `# Env:` is honored
# (DESIGN.md §8 "Config & install").

[project]
name = "assay"
# The chemistry engine (assay_core) and every skill share ONE conda env — the
# skills import assay_core in-process, so there is no per-skill env split. This
# name matches each skill's SKILL.md `# Env:` annotation and environment.yml.
conda_env = "anl_env"

[server]
# The stdio MCP server. Installed as a console entry point by `pip install -e .`
# (pyproject [project.scripts]); `configure_mcp.py` resolves it to the env's
# absolute bin path so an MCP host can launch it without the env activated.
name = "assay"
entry_point = "assay-mcp"          # console script -> mcp_server.server:main
module = "mcp_server.server"       # fallback: python -m mcp_server.server

[skills]
# Skills are discovered, not enumerated: assay_core.discovery walks this dir for
# */scripts/run.py and reads each SKILL_NAME/SUBCOMMAND manifest. Listing the dir
# (not the skills) keeps this file from drifting as skills are added.
dir = "skills"

[discovery]
# The registry-sync lint (tools/lint_skills.py --registry) enforces that the
# discovered skills, server.TOOLS, and the method-gate hook agree.
lint = "tools/lint_skills.py"

[remote]
# Run calculations on a REMOTE compute node (e.g. Aurora) over ssh, transparently
# to the agent, in the SAME synchronous tool call. Two ways to trigger it:
#
#   * PER-CALL (recommended): every skill tool exposes a `run_on` parameter —
#     the agent sets `run_on="aurora"` on an individual call to run just that
#     calculation remotely (and `run_on="local"`, the default, to run it here).
#     The host is resolved from this block: [remote].host, else the first line of
#     [remote].nodes_file (the node the aurora_nodeholder.pbs job publishes), else
#     the CHEMKIT_REMOTE_HOST env var. `enabled` is NOT required for per-call use.
#
#   * SESSION-WIDE: set `enabled = true` and run `configure_mcp.py`, which injects
#     CHEMKIT_REMOTE_HOST into the generated mcp_config.json server env so EVERY
#     call runs remotely by default (no per-call flag needed).
#
# Either way the runlog layer ssh'es the run to the host and streams the result
# JSON back; the result carries a `remote_host` field naming the node it ran on.
#
# ASSUMES a SHARED filesystem (cwd + input/--out paths resolve identically on both
# sides — true on Aurora, where $HOME/flare mount on compute nodes) and that the
# host is ssh-reachable from where the server runs (a login node, with a live
# allocation). Only fits calcs that finish within the tool timeout (~3600 s):
# xtb/PM7/small DFT. For long DFT use the async tools/aurora_submit.py instead.
# Compute nodes have no outbound internet, so name-to-smiles / build-from-smiles
# (PubChem/OPSIN lookups) should stay LOCAL — run those off the remote server.

# Master switch. false (default) = the server runs the engine locally.
enabled = false

# The compute-node hostname to ssh to. Leave empty to auto-pick the first host
# from `nodes_file` (the node list the aurora_nodeholder.pbs job publishes).
host = ""

# File listing allocated compute-node hostnames (one per line); the nodeholder
# writes this. Used only when `host` is empty. Path is relative to the repo root.
nodes_file = ".sweep_nodes"

# Extra ssh options (shlex-split into CHEMKIT_REMOTE_SSH_OPTS), e.g. a
# ControlMaster socket or "-o BatchMode=yes". Empty by default.
ssh_opts = ""
