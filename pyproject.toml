[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemkit-mcp"
# Single-sourced from assay_core.__version__ (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "chemkit: computational-chemistry MCP server (xtb, MOPAC, PySCF, Open Babel) over stdio"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Evan S. Robles" }]
keywords = ["chemistry", "mcp", "computational-chemistry", "xtb", "mopac", "pyscf", "ase"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Chemistry",
]
# ALL pip-installable runtime deps — no extras, everything installs by default.
#   pyscf/matplotlib : --method dft/hf + plots
#   sella            : transition-state saddle search (tasks/ts.py)
#   rdkit            : structure handling (tasks/scan.py + benchmark driver)
#   openai           : live agent scoring in the fidelity benchmark harness
# The engine imports the heavy ones lazily, so importing chemkit stays cheap even
# though they're all declared here.
#
# NOT listed (cannot be pip-installed — install from conda-forge via environment.yml):
# the external binaries xtb / mopac / openbabel, AND `xtb-python` (the `import xtb`
# API; there is NO PyPI wheel for it).
dependencies = [
  "mcp",
  "ase>=3.22",
  "numpy",
  "pyscf",
  "matplotlib",
  "sella",
  "rdkit",
  "openai",
  "pyyaml",     # config read/write for tools/aurora_submit.py + input_configs.yaml
]

[project.scripts]
# assay         : human-facing CLI — runs ONE calculation by dispatching to the
#                 skill's run.py (`assay sp --method xtb mol.xyz`), with the live
#                 .out log + level-of-theory and integrity gates.
# assay-mcp     : starts the stdio MCP server (for agents to connect to).
# chemkit / chemkit-mcp : retained aliases for the same two entry points.
assay       = "mcp_server.server:cli_main"
assay-mcp   = "mcp_server.server:main"
chemkit     = "mcp_server.server:cli_main"
chemkit-mcp = "mcp_server.server:main"

[project.urls]
Homepage   = "https://github.com/evan-robles/assay"
Repository = "https://github.com/evan-robles/assay"

[tool.setuptools]
# Repo-root top-level packages:
#   assay_core : the shared physics LIBRARY (was mcp_server/chemkit_engine; now
#                lives at the repo root, imported as `assay_core`). During the
#                skill-inversion migration it still carries cli.py + tasks/ so the
#                `-m assay_core.cli` path and the existing tests keep working.
#   mcp_server : the FastMCP dispatcher (server entry target).
#   skills     : self-contained skill workflows; importable so composite skills
#                can import a sibling primitive's run() in-process (DESIGN §5).
# Explicit list — autodiscovery is confused by the multi-top-level layout.
packages = [
    "assay_core", "assay_core.tasks",
    "assay_core.backends", "assay_core.backends.pyscf",
    "mcp_server",
]

# Version is read from assay_core/__init__.py::__version__ at build time, so
# the package has ONE version source (no pyproject<->__init__ drift).
[tool.setuptools.dynamic]
version = { attr = "assay_core.__version__" }

[tool.pytest.ini_options]
markers = [
    "slow: tests that take >30 s (organics, multi-step pipelines)",
]
